[package]
name = "ytdl-tools"
version = "0.1.0"
description = "Developer and release tooling of the YouTube Downloader extension (replaces the loose Node scripts)"
authors = ["Avi"]
edition = "2021"
publish = false
license = "Apache-2.0"

[[bin]]
name = "ytdl"
path = "src/main.rs"

[dependencies]
# The CDP and RDP clients and wire types are shared with the hot sidecar instead of being rewritten
ytdl-dev-hot = { path = "../dev-server" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "process", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# CDP page screenshots arrive base64-encoded
base64 = "0.22"
# The WebSocket client of one DevTools session (the sidecar keeps its own copy private)
tokio-tungstenite = "0.30"
# Send and receive halves of those WebSocket sessions
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# One shutdown signal for the hot loop, the watcher and the HMR server (the same token the library takes)
tokio-util = { version = "0.7", default-features = false }
# The dev server log lines go through tracing events the library emits
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
# Local wall-clock time in the "[2:05:33 PM]" log prefix
jiff = "0.2"
# The side-effect analysis and the payload checks parse TypeScript and JavaScript the way Vite parseAst did
oxc_allocator = "0.158"
oxc_ast = "0.158"
oxc_ast_visit = "0.158"
oxc_parser = "0.158"
oxc_span = "0.158"
oxc_syntax = "0.158"
# The state rewrites, the import stamping and the WXT auto-import scan are pattern based
regex = "1"

[dev-dependencies]
# Exports the plan types as TypeScript declarations under bindings/ for the launcher
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

# avi12-lint:begin rust-config (generated from rust-config-avi12; edit avi12-rust.local.toml)
[lints.rust]
# warnings-are-errors, no-suppression, naming-case, no-unused, no-dead-code
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_mut = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "deny"
non_camel_case_types = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
# narrowest-visibility
unreachable_pub = "deny"
# public-api-docs
missing_docs = "deny"
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Documentation of Result and panics is public-API prose; missing_docs covers the rest
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# A pedantic hint that every pure function carry #[must_use]; rustc unused_must_use covers real results
must_use_candidate = "allow"
# no-unchecked-unwrap
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# no-unchecked-cast
as_conversions = "deny"
cast_possible_truncation = "deny"
undocumented_unsafe_blocks = "deny"
# no-suppression
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# todo-needs-owner
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# identifier-length (the idioms are in clippy.toml)
min_ident_chars = "deny"
# early-return
needless_return = "deny"
redundant_else = "deny"
collapsible_else_if = "deny"
# size-limits, max-nesting (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
# no-floating-result
let_underscore_future = "deny"
# banned-apis (the list is in clippy.toml)
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# avi12-lint:end
